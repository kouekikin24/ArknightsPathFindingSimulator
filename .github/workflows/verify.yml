name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core regression suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile core, UI, and test sources
        shell: bash
        run: |
          mkdir -p out
          find src/main src/ui src/test -name "*.java" > out/sources.txt
          javac --release 21 -encoding UTF-8 -cp "lib/flatlaf.jar" -d out @out/sources.txt

      - name: Run simulator regression tests
        shell: bash
        run: java -Dfile.encoding=UTF-8 -cp "out;lib/flatlaf.jar" SimulatorTests

  ui-verify:
    name: UI session verification (headless)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile core, UI, and test sources
        shell: bash
        run: |
          mkdir -p out
          find src/main src/ui src/test -name "*.java" > out/sources.txt
          javac --release 21 -encoding UTF-8 -cp "lib/flatlaf.jar" -d out @out/sources.txt

      - name: Run UI session verification
        shell: bash
        run: java -Dfile.encoding=UTF-8 -cp "out;lib/flatlaf.jar" SimulatorUiMain --verify
